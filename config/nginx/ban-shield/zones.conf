# Ban Shield companion HTTP rate/connection limits. Keep referenced zone names stable.
# =============================================================================
# RATE LIMITING ZONES
# These zones must be in the http {} context (conf.d), not inside server {}.
# =============================================================================

# WordPress login rate limit: 5 requests/minute per IP
# Burst of 3 allows brief spikes without instantly triggering 429.
limit_req_zone $binary_remote_addr zone=wplogin:10m rate=5r/m;

# General per-IP rate limit: 30 requests/second per IP
# Protects all server blocks from scanner bursts before Fail2ban can act.
limit_req_zone $binary_remote_addr zone=global_rate:10m rate=30r/s;

# Vaultwarden login rate limit: 5 requests/minute per IP.
# Burst of 5 accommodates normal client retries without allowing rapid
# credential stuffing against /identity/connect/token.
limit_req_zone $binary_remote_addr zone=vaultwarden_login:10m rate=5r/m;

# Return 429 (Too Many Requests) instead of the default 503 on rate-limit hits
limit_req_status 429;


limit_conn_zone $binary_remote_addr zone=per_client_conn:10m;
