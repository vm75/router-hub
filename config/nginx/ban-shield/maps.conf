# Match the original request URI so encoded traversal/query probes are visible.
# This map is enforced at server rewrite phase by ban-shield/security-trap-gate.conf,
# before ^~ subfolder locations can bypass regex locations.
map $request_uri $security_trap {
    default 0;
    ~*(?:^|/)\.git(?:/|$|\?)                                      1;
    ~*(?:^|/)\.(?:env|aws|ssh|svn|hg)(?:[./?]|$)                   1;
    ~*(?:^|/)\.(?:htaccess|htpasswd|user\.ini)(?:[/?]|$)            1;
    ~*(?:^|/)(?:wp-config(?:\.[^/?]*)?|docker-compose(?:\.[^/?]*)?\.ya?ml|credentials?\.json|secrets?\.(?:json|ya?ml)|(?:db|data|database|backup|dump)\.sql|id_rsa(?:\.pub)?|\.htpasswd|phpinfo\.php|adminer\.php)(?:[/?]|$) 1;
    ~*(?:^|/)(?:c99|r57|wso|b374k|alfa|mini(?:shell)?|cmd|shell|backdoor|webshell|wp_filemanager|this_is_a_new_hello_world)\.php(?:[/?]|$) 1;
    ~*^/wp-content/uploads/.*\.php(?:[/?]|$)                       1;
    ~*(?:\.\.%2f|\.\.%5c|%2e%2e(?:/|%2f|\\|%5c)|/etc/passwd|/proc/self/(?:environ|fd)) 1;
    ~*(?:php|data|expect|phar)://                                  1;
    ~*%24\{jndi:                                                   1;
    ~*(?:/bin/(?:sh|bash)|/wanipcn\.xml|/UD/act|/hudson/)          1;
    ~*^/xmlrpc\.php(?:[/?]|$)                                     1;
    ~*(?:^|/)(?:phpmyadmin|myadmin|pma)(?:[/?]|$)                 1;
    ~*(?:^|/)setup\.php(?:[/?]|$)                                 1;
    ~*(?:/cgi-bin/|/HNAP1/|/GponForm/|/setup\.cgi(?:[/?]|$)|/actuator/|/solr/|/jenkins/) 1;
}

# Optional administrator-owned exceptions; defaults contain no deployed hostnames.
map "$host$request_uri" $security_trap_allow {
    default 0;
    include settings/security_trap_allow.conf;
}


map $http_user_agent $bad_bot {
    default 0;
    ~*(?:libwww|wget|lwp-trivial|curl|urllib|python-requests|zgrab|masscan|nikto|sqlmap|nmap|dirb|gobuster) 1;
}

map "$security_trap:$security_trap_allow:$bad_bot" $any_trap {
    default 0;

    # Block security traps unless this exact endpoint is allowed.
    ~^1:0: 1;

    # Continue blocking scanner user agents.
    ~:1$ 1;
}
