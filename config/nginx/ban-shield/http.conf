# Include once inside http {} through conf.d/00-ban-shield.conf.
include ban-shield/zones.conf;
include ban-shield/log-formats.conf;
include ban-shield/maps.conf;
include ban-shield/log-conditions.conf;
include ban-shield/access-logging.conf;

# Reduce Slowloris/resource-exhaustion exposure on a small router.
client_header_timeout 10s;
client_body_timeout 15s;
reset_timedout_connection on;
