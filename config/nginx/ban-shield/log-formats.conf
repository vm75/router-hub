# Stable input contract for Router Hub Ban Config log rules.
# Keep client IP first and preserve trap/badbot field names and quoting.
log_format f2b_access '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent" host="$host"';
log_format f2b_trap '$remote_addr - - [$time_local] "$request_method $uri $server_protocol" $status host="$host" trap="$security_trap" badbot="$bad_bot" ua="$http_user_agent"';
