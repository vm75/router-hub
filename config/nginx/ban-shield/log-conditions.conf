# Successful matched checks are quiet; failures and traps stay visible.
map "$any_trap:$access_log_suppressed:$status" $log_normal_access {
    default 1;
    ~^0:1:2[0-9][0-9]$ 0;
}

# An explicitly quiet route still records security traps in both destinations.
map $any_trap $log_traps_only {
    default 0;
    1 1;
}
