# Router Hub shared nginx snippet: proxy-common.conf

# Required for WebSockets on older Nginx versions.
proxy_http_version 1.1;

# Preserve the original request information.
proxy_set_header Host               $host;
proxy_set_header X-Real-IP          $remote_addr;
# proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-For    $remote_addr;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-Host   $host;
proxy_set_header X-Forwarded-Port   $server_port;
proxy_set_header X-Forwarded-Method $request_method;
proxy_set_header X-Original-Method  $request_method;

# WebSockets.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Fail reasonably quickly if an application is unavailable.
proxy_connect_timeout 10s;

# Additional hardening
proxy_set_header Proxy "";
# Only useful for certain authentication gateways
# proxy_set_header X-Original-Method $request_method;
# Only useful when URI rewriting hides the original URL
# proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
