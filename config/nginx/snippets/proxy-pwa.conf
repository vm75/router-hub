# Common reverse-proxy behavior for progressive web apps.
#
# Keep the URI rewrite in the app-specific location. The backend is selected by
# conf.d/04_subfolder_upstream_map.conf and snippets/subfolder-proxy-pass.conf.

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_http_version 1.1;
proxy_buffering off;
