# Router Hub manages subdomain upstream entries in this map.
map $host $subdomain_upstream {
    default "";
}

# Resolve certificate folders from hostnames. Rule 1 handles DuckDNS names;
# rule 2 handles a subdomain plus a two-label domain, such as
# eb5.newhopes.info -> eb5_newhopes_info. Rule 3 handles base domains.
map $host $domain_cert_folder {
    hostnames;
    default '';
    ~^(?<subdomain>[^.]+)\.(?<domain>[^.]+)\.duckdns\.org$ ${subdomain}_${domain}_duckdns_org;
    ~^(?<subdomain>[^.]+)\.(?<domain>[^.]+)\.(?<tld>[^.]+)$ ${subdomain}_${domain}_${tld};
    ~^(?<domain>[^.]+)\.(?<tld>[^.]+)$ ${domain}_${tld};
}
