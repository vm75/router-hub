# Shared HTTP settings used by Router Hub templates.
server_tokens off;
client_max_body_size 16M;
sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
gzip on;
gzip_vary on;

limit_req_zone $binary_remote_addr zone=router_hub_global:10m rate=30r/s;
limit_req_status 429;

# WebSocket connection upgrade support for proxy-common.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
