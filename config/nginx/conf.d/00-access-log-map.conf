# Long exact healthcheck keys exceed the default bucket size on common builds.
map_hash_bucket_size 128;

map $request_uri $log_request_path {
    ~^(?<log_original_path>[^?]*) $log_original_path;
    default $request_uri;
}

map "$host|$request_method|$log_request_path|$http_user_agent|$remote_addr" $access_log_suppressed {
    default 0;
    include settings/access_log_suppress.conf;
}
