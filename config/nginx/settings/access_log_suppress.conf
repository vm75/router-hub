# Ordinary log suppression is disabled by default; failures and traps remain logged.
# Configure actual rules in nginx.deploy/settings/access_log_suppress.conf.
# Key: host|method|original path without query|User-Agent|nginx-observed client IP
# nginx exact keys are case-insensitive; values must be 0 or 1.
# See examples/access_log_suppress.conf for a synthetic healthcheck example.
