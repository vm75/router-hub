[package]
name = "router-hub"
version = "0.6.1"
edition = "2024"
description = "A lightweight management hub for Asuswrt-Merlin routers"
license = "MIT"
rust-version = "1.85"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
parking_lot = "0.12"
regex = "1"
regex-automata = { version = "0.4", features = ["hybrid", "syntax", "perf-literal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
daemonize = "0.5.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
