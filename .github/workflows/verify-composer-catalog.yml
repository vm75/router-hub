name: Temporary Nginx catalog branch verification
on:
  push:
    branches: [feature/composable-nginx-sites]
permissions:
  contents: write
concurrency:
  group: composable-catalog-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - run: cargo +1.85.0 fmt --all
      - run: cargo +1.85.0 test --locked
      - run: cargo +1.85.0 clippy --all-targets --locked -- -D warnings
      - name: Commit formatting to feature branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src tests
            git commit -m "style: format TOML-driven nginx composer"
            git push origin HEAD:feature/composable-nginx-sites
          fi
