name: Format security analytics branch

on:
  push:
    branches:
      - feature/security-analytics

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/security-analytics
          persist-credentials: true

      - name: Install baseline Rust formatter
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt

      - name: Format Rust sources
        run: cargo +1.85.0 fmt --all

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt to analytics implementation'
          git push origin HEAD:feature/security-analytics
