name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lockfile-refresh:
    name: WIP refresh Cargo.lock
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/security-analytics
          persist-credentials: true

      - name: Refresh dependency feature resolution
        run: cargo check

      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'build: refresh lockfile for analytics streaming'
          git push origin HEAD:feature/security-analytics

  full:
    name: Full CI (Rust 1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install baseline Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Run tests
        run: cargo +1.85.0 test --locked

      - name: Run Clippy
        run: cargo +1.85.0 clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo +1.85.0 build --release --locked

  stable:
    name: Stable compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check all targets on stable Rust
        run: cargo +stable check --locked --all-targets
