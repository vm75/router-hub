name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format-snapshot:
    name: WIP rustfmt snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install baseline Rust formatter
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt

      - name: Format Rust sources
        run: cargo +1.85.0 fmt --all

      - name: Upload formatted Rust sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rustfmt-output
          path: src/**/*.rs
          if-no-files-found: error
          retention-days: 1

  full:
    name: Full CI (Rust 1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install baseline Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Run tests
        run: cargo +1.85.0 test --locked

      - name: Run Clippy
        run: cargo +1.85.0 clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo +1.85.0 build --release --locked

  stable:
    name: Stable compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check all targets on stable Rust
        run: cargo +stable check --locked --all-targets
