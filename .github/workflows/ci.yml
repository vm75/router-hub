name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  source-fix:
    name: WIP apply analytics source fixes
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/security-analytics
          persist-credentials: true

      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          replace(
              "Cargo.toml",
              'reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }',
              'reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }',
          )
          replace("src/analytics/model.rs", "kernel_verify_interval_seconds: 3600,", "kernel_verify_interval_seconds: 7200,")
          replace("src/analytics/mod.rs", "use tracing::{info, warn};", "use tracing::warn;")
          replace(
              "src/analytics/mod.rs",
              """                    self.overhead.lock().samples_dropped =
                        self.overhead.lock().samples_dropped.saturating_add(1);""",
              """                    let mut overhead = self.overhead.lock();
                    overhead.samples_dropped = overhead.samples_dropped.saturating_add(1);""",
          )
          replace(
              "src/analytics/mod.rs",
              """                tokio::select! {
                    _ = tokio::time::sleep(Duration::from_secs(30)) => {},
                    _ = self.notify.notified() => {},
                }
                continue;""",
              """                self.notify.notified().await;
                continue;""",
          )
          replace(
              "src/analytics/mod.rs",
              """            for (name, (matches, bans)) in &status.snapshot.rule_stats {
                let (previous_matches, previous_bans) = previous
                    .rule_stats
                    .get(name)
                    .copied()
                    .unwrap_or((matches.match_count, matches.ban_count));
                let match_delta = counter_delta(matches.match_count, previous_matches);
                let ban_delta = counter_delta(matches.ban_count, previous_bans);""",
              """            for (name, stats) in &status.snapshot.rule_stats {
                let (previous_matches, previous_bans) = previous
                    .rule_stats
                    .get(name)
                    .copied()
                    .unwrap_or((stats.match_count, stats.ban_count));
                let match_delta = counter_delta(stats.match_count, previous_matches);
                let ban_delta = counter_delta(stats.ban_count, previous_bans);""",
          )
          replace(
              "src/analytics/mod.rs",
              """        self.overhead.lock().external_commands =
            self.overhead.lock().external_commands.saturating_add(1);""",
              """        {
            let mut overhead = self.overhead.lock();
            overhead.external_commands = overhead.external_commands.saturating_add(1);
        }""",
              count=2,
          )
          replace(
              "src/analytics/mod.rs",
              """        self.overhead.lock().ai_requests_attempted =
            self.overhead.lock().ai_requests_attempted.saturating_add(1);""",
              """        {
            let mut overhead = self.overhead.lock();
            overhead.ai_requests_attempted = overhead.ai_requests_attempted.saturating_add(1);
        }""",
          )
          replace(
              "src/analytics/mod.rs",
              """                self.overhead.lock().ai_requests_failed =
                    self.overhead.lock().ai_requests_failed.saturating_add(1);""",
              """                let mut overhead = self.overhead.lock();
                overhead.ai_requests_failed = overhead.ai_requests_failed.saturating_add(1);""",
          )
          replace(
              "src/analytics/mod.rs",
              """        EngineEvent::Match {
            rule, ip, groups, ..
        } => {
            let (request_method, request_path) = parse_request_line(""",
              """        EngineEvent::Match {
            rule, ip, groups, ..
        } => {
            if !ingress.collect_samples.load(Ordering::Relaxed) {
                return;
            }
            let (request_method, request_path) = parse_request_line(""",
          )
          replace(
              "src/analytics/mod.rs",
              """                method: ingress
                    .collect_samples
                    .load(Ordering::Relaxed)
                    .then_some(method)
                    .flatten(),
                path: ingress
                    .collect_samples
                    .load(Ordering::Relaxed)
                    .then_some(path)
                    .flatten(),""",
              """                method,
                path,""",
          )
          replace(
              "src/ban_attack/engine.rs",
              """    fn emit(&mut self, event: EngineEvent) {
        match event {""",
              """    fn emit(&mut self, event: EngineEvent) {
        crate::analytics::record_engine_event(&event);
        match event {""",
          )
          replace(
              "src/analytics/ai.rs",
              """        if matches!(
            lower.as_str(),
            "authorization" | "proxy-authorization" | "cookie" | "set-cookie" | "host"
        ) {
            bail!("AI additional_headers cannot override sensitive transport headers");
        }""",
              """        if matches!(
            lower.as_str(),
            "authorization"
                | "proxy-authorization"
                | "cookie"
                | "set-cookie"
                | "host"
                | "content-type"
        ) || ["auth", "key", "token", "secret", "cookie"]
            .iter()
            .any(|marker| lower.contains(marker))
        {
            bail!("AI additional_headers cannot contain or override sensitive transport headers");
        }""",
          )
          replace(
              "src/asus_ui.rs",
              """    let initial_refresh = "    refreshCurrent();";
    let analytics_script = format!("{ANALYTICS_JS}\\n{initial_refresh}");

    source
        .replace(desktop_anchor, &desktop_tabs)
        .replace(sidebar_anchor, &sidebar_tabs)
        .replace(title_anchor, titles)
        .replace(refresh_anchor, refresh)
        .replace(pane_anchor, &pane)
        .replacen(initial_refresh, &analytics_script, 1)""",
              """    let script_anchor = "    setInterval(pollSystemUsage, 1000);\\n\\n    refreshCurrent();";
    let analytics_script = format!(
        "    setInterval(pollSystemUsage, 1000);\\n\\n{ANALYTICS_JS}\\n    refreshCurrent();"
    );

    source
        .replace(desktop_anchor, &desktop_tabs)
        .replace(sidebar_anchor, &sidebar_tabs)
        .replace(title_anchor, titles)
        .replace(refresh_anchor, refresh)
        .replace(pane_anchor, &pane)
        .replace(script_anchor, &analytics_script)""",
          )
          PY

      - name: Install baseline Rust formatter
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt

      - name: Format Rust sources
        run: cargo +1.85.0 fmt --all

      - name: Commit source fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: tighten analytics performance and compile gates'
          git push origin HEAD:feature/security-analytics

  full:
    name: Full CI (Rust 1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install baseline Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +1.85.0 fmt --all -- --check

      - name: Run tests
        run: cargo +1.85.0 test --locked

      - name: Run Clippy
        run: cargo +1.85.0 clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        run: cargo +1.85.0 build --release --locked

  stable:
    name: Stable compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Check all targets on stable Rust
        run: cargo +stable check --locked --all-targets
